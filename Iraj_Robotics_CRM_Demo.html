function activitiesPage(){let allowedActivities=activities.filter(a=>supervisor()||a.assignedTo===currentUser||a.owner===user(currentUser).name);let scheduled=allowedActivities.filter(a=>a.status==='Scheduled').sort((a,b)=>(a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||'')));let completed=allowedActivities.filter(a=>a.status!=='Scheduled');let today='2026-11-06';let overdue=scheduled.filter(a=>a.date<today);$('view').innerHTML=pageHead('Calls & follow-ups','Phase 1: call customers using the team’s regular phones, then log the outcome and schedule callbacks in CRM. Phase 2: Zoho Voice integration.',`<button class="btn secondary" onclick="openScheduleCallForm()">＋ Schedule call</button> <button class="btn primary" onclick="openActivityForm()">＋ Log completed call</button>`)+
`<div class="grid stats">${stat('Scheduled calls',scheduled.length,'Upcoming callbacks','◷')}${stat('Overdue calls',overdue.length,'Need attention','!')}${stat('Completed activities',completed.length,'Call and meeting history','✓')}${stat('Today’s calls',scheduled.filter(a=>a.date===today).length,'Planned for today','☎')}</div>
<section class="panel"><div class="panelhead"><h3>Upcoming & overdue calls</h3><span>Manual calling · Phase 1</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Scheduled date / time</th><th>Lead / customer</th><th>Purpose</th><th>Assigned to</th><th>Reminder</th><th>Status</th><th>Action</th></tr></thead><tbody>${scheduled.map(a=>`<tr><td><b>${a.date}</b><br><small>${esc(a.time||'Time not set')}</small></td><td><span class="link" onclick="openRecord('${a.lead}')">${esc(a.customer||a.lead)}</span></td><td>${esc(a.purpose||a.note||'Follow-up')}</td><td>${esc(a.owner)}</td><td>${esc(a.reminder||'No reminder')}</td><td><span class="badge ${a.date<today?'b-red':'b-orange'}">${a.date<today?'Overdue':'Scheduled'}</span></td><td><button class="btn primary" style="padding:6px 9px" onclick="completeScheduledCall('${a.id}')">Log outcome</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No calls scheduled. Use Schedule call to plan the next customer conversation.</td></tr>'}</tbody></table></div></section>

</section>`;}
function blueprintPage(){$('view').innerHTML=pageHead('CRM Blueprint & transition rules','A guided view of the transition gates configured in this demo.')+`<section class="panel"><div class="panelhead"><h3>Lead Blueprint</h3><span>Lead module</span></div><div class="pipeline">${['New Enquiry','Cold Call','Qualified','Lost'].map((s,i)=>`<div class="pipe-step"><div class="pipe-bar"></div><b>${s}</b><small>${i===2?'Convert to Deal':i===3?'Close lead':'Transition'}</small></div>`).join('')}</div><p class="muted" style="font-size:11px">Qualification requires a call outcome and qualification reason. Not qualified leads close as Lost with a mandatory loss reason.</p></section><section class="panel"><div class="panelhead"><h3>Deal Blueprint</h3><span>Deal module</span></div><div class="pipeline">${['Site Sales','Technical Study','Concept','Costing & Quote','Follow-up','Won / Lost'].map(s=>`<div class="pipe-step"><div class="pipe-bar"></div><b>${s}</b><small>Controlled transition</small></div>`).join('')}</div><table class="table"><thead><tr><th>Transition</th><th>Gate / condition</th><th>Responsible role</th></tr></thead><tbody><tr><td>Qualify lead</td><td>Call logged + reason entered</td><td>Sales Caller</td></tr><tr><td>Assign to Site Sales</td><td>Capability-based assignment</td><td>BDM Head</td></tr><tr><td>BDM value assessment</td><td>Below ₹50L → Site Sales; above ₹50L → Senior Sales</td><td>BDM Head</td></tr><tr><td>Manager site visit trigger</td><td>Estimated value above ₹100L automatically requires manager assignment and in-person visit</td><td>BDM Head + assigned Manager</td></tr><tr><td>Verify technical study</td><td>Standard questionnaire completed</td><td>Technical Manager</td></tr><tr><td>Record manager site visit</td><td>Mandatory above ₹100L before Concept transition</td><td>Assigned Manager</td></tr><tr><td>Upload concept</td><td>Concept file/reference attached</td><td>Concept Engineer</td></tr><tr><td>Prepare quote</td><td>Costing completed within 2 days</ function integrationsPage(){$('view').innerHTML=pageHead('App integrations','The CRM owns customer, enquiry, quote and sales order records. These are demo integration events, not live API connections.')+`<div class="grid two-col"><section class="panel"><div class="panelhead"><h3>Zoho Books</h3><span class="badge b-blue">Downstream</span></div><div style="font-size:30px">▤</div><h3>Sales order sync</h3><p class="muted">When the BDM creates a sales order from a Won deal, the sales order is simulated as synced to Zoho Books.</p><div class="successbox">Demo event: Sales Order → Zoho Books</div></section><section class="panel"><div class="panelhead"><h3>Zoho Creator</h3><span class="badge b-purple">Downstream</span></div><div style="font-size:30px">▦</div><h3>Project record opening</h3><p class="muted">The Won sales order opens the project record in Iraj Project Operations for project setup and handover.</p><div class="successbox">Demo event: Sales Order → Creator project setup</div></section></div><section class="panel"><h3 style="margin-top:0">Integration boundary</h3><p class="muted">CRM is the system of record for customer, enquiry, quote and sales order. Creator owns the project record and phases. Books owns budgets, invoices and payments. The frontend only demonstrates the handoff event; it does not connect to the live Zoho organisation.</p></section>`;}

function field(label,name,placeholder='',type='text',value=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" value="${esc(value)}"></div>`}

function openScheduleCallForm(prefillId=''){ openModal('Schedule customer call',`<form id="scheduleForm" class="formgrid">${selectField('Related lead / deal','lead',visibleRecords().filter(r=>!['Won','Lost'].includes(r.status)).map(r=>r.id+' · '+r.name),prefillId?`${prefillId} · ${records.find(r=>r.id===prefillId)?.name||prefillId}`:'')}${selectField('Call type','type',['Cold call','Follow-up','Quote follow-up','Technical discussion','Customer meeting'])}${field('Scheduled date','date','','date','2026-11-07')}${field('Scheduled time','time','','time','11:30')}${selectField('Assigned to','assignedTo',(supervisor()?users.filter(u=>['Sales Caller','Site Sales','Senior Sales'].includes(u.role)): [user(currentUser)]).map(u=>u.id+' · '+u.name),currentUser+' · '+user(currentUser).name)}${selectField('Reminder','reminder',['At scheduled time','5 minutes before','15 minutes before','30 minutes before','1 hour before','1 day before','No reminder'],'15 minutes before')}<div class="field full"><label>Call purpose / agenda</label><textarea name="purpose" placeholder="What needs to be discussed with the customer?"></textarea></div></form>`,`<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveScheduledCall()">Schedule call</button>`);}
function saveScheduledCall(){let f=Object.fromEntries(new FormData($('scheduleForm')).entries());if(!f.lead||!f.date||!f.time||!f.purpose){alert('Select a customer, date, time and enter the call purpose.');return}let leadId=f.lead.split(' · ')[0],r=records.find(x=>x.id===leadId),assignee=f.assignedTo.split(' · ');if(!r||!canViewRecord(r)){alert('You can schedule calls only for records assigned to you.');return}if(!supervisor()&&assignee[0]!==currentUser){alert('You can assign this call only to yourself.');return}activities.unshift({id:'ACT-'+Date.now(),lead:leadId,customer:r?.name||leadId,type:f.type,date:f.date,time:f.time,owner:assignee.slice(1).join(' · '),assignedTo:assignee[0],reminder:f.reminder,purpose:f.purpose,status:'Scheduled'});if(r)log(r,'Customer call scheduled',`${f.type} planned for ${f.date} at ${f.time}. Assigned to ${assignee.slice(1).join(' · ')}. Purpose: ${f.purpose}`);save();closeModal();render();}
function openActivityForm(prefill={}){let a=activities.find(x=>x.id===prefill.id);let selectedLead=a?.lead||prefill.lead||'';let r=records.find(x=>x.id===selectedLead);openModal('Log completed call',`<form id="activityForm" class="formgrid">${selectField('Related lead','lead',visibleRecords().map(r=>r.id+' · '+r.name),selectedLead?(selectedLead+' · '+(r?.name||selectedLead)):'')}${selectField('Activity type','type',['Cold call','Follow-up','Quote follow-up','Technical discussion','Customer meeting','Email'],a?.type||'Cold call')}${field('Actual call date','date','','date','2026-11-06')}${field('Actual call time','time','','time','11:30')}${selectField('Call outcome','outcome',['Connected – Interested','Connected – Not Interested','No Answer','Busy','Call Back Requested','Meeting Scheduled','Requirement Clarification'], '')}<div class="field full"><label>Discussion notes / outcome</label><textarea name="note" placeholder="What did the customer say? Record the discussion and agreed action."></textarea></div><div class="field"><label>Next follow-up date (optional)</label><input name="nextDate" type="date"></div><div class="field"><label>Next follow-up time (optional)</label><input name="nextTime" type="time"></div></form>`,`<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveActivity('${a?.id||''}')">Save call log</button>`);}
function completeScheduledCall(id){let a=activities.find(x=>x.id===id);if(a&&!supervisor()&&a.assignedTo!==currentUser){alert('This call is assigned to another employee.');return}openActivityForm({id});}
function saveActivity(scheduledId=''){let f=Object.fromEntries(new FormData($('activityForm')).entries());if(!f.lead||!f.note||!f.outcome){alert('Select a lead, call outcome and enter discussion notes.');return}let leadId=f.lead.split(' · ')[0],r=records.find(x=>x.id===leadId),owner=user(currentUser).name;if(!r||!canViewRecord(r)){alert('You can log calls only for records assigned to you.');return}let item={id:'ACT-'+Date.now(),lead:leadId,customer:r?.name||leadId,type:f.type,outcome:f.outcome,date:f.date,time:f.time,owner,note:f.note,nextDate:f.nextDate||'',nextTime:f.nextTime||'',status:'Completed'};if(scheduledId){let idx=activities.findIndex(x=>x.id===scheduledId);if(idx>=0){let planned=activities[idx];item.owner=planned.owner;item.scheduledDate=planned.date;item.scheduledTime=planned.time;activities.splice(idx,1);}}activities.unshift(item);if(r){if(f.type==='Cold call'&&r.status==='New Enquiry')r.status='Cold Call';log(r,f.type+' logged · '+f.outcome,f.note+(f.nextDate?` Next follow-up: ${f.nextDate} ${f.nextTime||''}.`:''));}if(f.nextDate){activities.unshift({id:'ACT-'+(Date.now()+1),lead:leadId,customer:r?.name||leadId,type:'Follow-up',date:f.nextDate,time:f.nextTime||'09:00',owner,assignedTo:currentUser,reminder:'15 minutes before',purpose:'Callback after previous call: '+f.outcome,status:'Scheduled'});}save();closeModal();render();}
function openRecord(id){selectedId=id;let r=records.find(x=>x.id===id);if(!r)return;if(!canViewRecord(r)){alert('This record is assigned to another team member. You can only access your assigned work.');return}let role=user(currentUser).role;let actions='';

if(r.status==='Concept Uploaded'&&(canPerform(r,'Costing Engineer')||supervisor()))actions+=`<button class="btn primary" onclick="prepareQuote('${id}')">Prepare costing & quote</button>`;
if(r.status==='Costing & Quote'&&r.quote&&(canPerform(r,'Site Sales')||canPerform(r,'Senior Sales')||supervisor()))actions+=`<button class="btn primary" onclick="sendQuote('${id}')">Send quote & start follow-up</button>`;

if(r.pendingRevision&&role==='CEO')actions+=`<button class="btn success" onclick="approvePendingRevision('${id}')">Approve cost revision</button>`;
if(r.status==='Won'&&!r.salesOrder&&['BDM Head','CEO'].includes(role))actions+=`<button class="btn primary" onclick="createSalesOrder('${id}')">＋ Create sales order</button>`;
if(!['Won','Lost'].includes(r.status)){actions+=`<button class="btn secondary" onclick="closeModal();openScheduleCallFormFor('${id}')">＋ Schedule call</button><button class="btn secondary" onclick="closeModal();openActivityFormFor('${id}')">Log completed call</button>`;}let tech=r.tech||{};openModal('CRM record · '+r.id,`<div class="detailtop"><div><div class="muted" style="font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px">CURRENT BLUEPRINT STAGE</div><h2>${esc(r.name)}</h2><div class="muted">${esc(r.id)} · ${esc(r.contact)} · ${esc(r.industry||'Industry not entered')}</div><div style="margin-top:9px">${badge(r.status)}</div></div>${r.status==='Lost'?'<span class="badge b-red">Closed · Lost</span>':r.status==='Won'?'<span class="badge b-green">Closed · Won</span>':''}</div><section class="panel" style="margin:14px 0 16px;padding:16px 18px;border:1px solid #dbe3ef;box-shadow:0 2px 8px rgba(15,23,42,.06);border-radius:12px;background:#fff"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><h3 style="margin:0;font-size:16px;color:#17233b">Blueprint</h3><span class="muted" style="font-size:11px">Deal workflow</span></div><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px"><span style="font-size:12px;color:#64748b;font-weight:700">Current State</span><strong style="font-size:13px;color:#17233b">${esc(r.status)}</strong>${r.status==='Won'?'<span class="badge b-green">Closed · Won</span>':r.status==='Lost'?'<span class="badge b-red">Closed · Lost</span>':''}</div><div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-top:15px"><span style="font-size:12px;color:#64748b;font-weight:700;padding-top:8px">Transitions</span><div class="actionbuttons" style="display:flex;gap:8px;flex-wrap:wrap;flex:1">${actions||'<span class="muted" style="font-size:11px;padding:8px 0">No transition available for this role and current state.</span>' iontitle">Technical study</div><div class="kv"><div><small>Application</small><b>${esc(tech.application||'Pending')}</b></div><div><small>Cycle time</small><b>${esc(tech.cycle||'—')}</b></div><div><small>Capacity</small><b>${esc(tech.capacity||'—')}</b></div><div><small>Manager verification</small><b>${tech.verified?'Verified':'Pending'}</b></div></div>${r.concept?`<p class="muted" style="font-size:10px">Concept: ${esc(r.concept)}</p>`:''}${r.assignmentReviewRequired?`<div class="notice"><b>Sales assignment review required</b><p style="margin:5px 0 0">Final quote value changed the assignment band. BDM must review the sales owner and manager visit requirement.</p><button class="btn secondary" style="margin-top:8px" onclick="assignFromDetail('${id}')">Review assignment</button></div>`:''}${r.lostReason?`<div class="notice" style="margin-top:12px"><b>Why this was lost</b><p style="margin:5px 0 0">${esc(r.lostReason)}</p></div>`:''}${r.status==='Won'?`<div class="successbox" style="margin-top:12px"><b>Won outcome</b><br>${esc(r.salesOrder||'Sales Order not yet created')} · ${r.salesOrder?'Books / Creator handoff recorded':'Ready for BDM sales order creation'}</div>`:''}</div></div>`,`<button class="btn secondary" onclick="closeModal()">Close</button>`);}
function qualify(id){let r=records.find(x=>x.id===id);if(!supervisor()&&(user(currentUser).role!=='Sales Caller'||(r.assignedCaller||r.owner)!==currentUser)){alert('Only the assigned Sales Caller can qualify this enquiry.');return}if(!r)return;closeModal();openModal('Qualify lead · '+id,`<form id="qualForm" class="formgrid">${selectField('Qualification outcome','outcome',['Qualified'])}${field('Qualification reason','reason','Industry fit, requirement, project readiness…')}${field('Call date','date','','date','2026-11-06')}<div class="field full"><label>Call notes</label><textarea name="notes" placeholder="Record customer discussion"></textarea></div></form>`,`<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveQualification('${id}')">Confirm qualification</button>`);}
function saveQualification(id){let rec=records.find(x=>x.id===id);if(!supervisor()&&(user(currentUser).role!=='Sales Caller'||(rec.assignedCaller||rec.owner)!==currentUser)){alert('Only the assigned Sales Caller can qualify this enquiry.');return}let f=Object.fromEntries(new FormData($('qualForm')).entries()),r=records.find(x=>x.id===id);if(!f.reason){alert('Qualification reason is required.');return}activities.unshift({lead:id,type:'Cold call',owner:user(currentUser).name,date:f.date,note:f.notes||f.reason});r.description=(r.description||'')+' Qualification: '+f.reason+'. '+f.notes;r.status='Qualified';log(r,'Lead qualified',f.reason);save();closeModal();openRecord(id);}
function disqualify(id){let rec=records.find(x=>x.id===id);if(!supervisor()&&(user(currentUser).role!=='Sales Caller'||(rec.assignedCaller||rec.owner)!==currentUser)){alert('Only the assigned Sales Caller can mark this enquiry not qualified.');return}closeModal();openModal('Mark lead not qualified',`<form id="lostLead" class="formgrid">${selectField('Reason','reason',['Industry not relevant','Budget not approved','Requirement not suitable','No response','Project deferred','Other'])}<div class="field full"><label>Additional notes</label><textarea name="notes"></textarea></div></form>`,`<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="saveDisqualify('${id}')">Mark Lost</button>`);}
function saveDisqualify(id){let rec=records.find(x=>x.id===id);if(!supervisor()&&(user(currentUser).role!=='Sales Caller'||(rec.assignedCaller||rec.owner)!==currentUser)){alert('Only the assigned Sales Caller can close this enquiry as not qualified.');return}let f=Object.fromEntries(new FormData($('lostLead')).entries()),r=records.find(x=>x.id===id);if(f.reason==='Other'&&!f.notes.trim()){alert('Please explain the reason when Other is selected.');return}r.status='Lost';r.lostReason=f.reason+(f.notes?' · '+f.notes:'');log(r,'Not qualified · Lost',r.lostReason);save();closeModal();render();}
function assignFromDetail(id){openAssignmentModal(id);}
function openAssignmentModal(id){
 let r=records.find(x=>x.id===id);if(!r)return;
 let estimate=Number(r.estimatedValue??r.value??0);
 let options=users.filter(u=>['Site Sales','Senior Sales'].includes(u.role));
 let managerOptions=users.filter(u=>['Technical Manager','BDM Head'].includes(u.role));
 let autoVisit=managerVisitForValue(estimate);
 let ownerOptions=options.filter(u=>salesRouteForValue(estimate)==='Senior Sales'?u.role==='Senior Sales':u.role==='Site Sales');
 if(!ownerOptions.length)ownerOptions=options;
 openModal('BDM assignment & value assessment',`<form id="assignForm" class="formgrid">
 <div class="field"><label>Estimated project value (₹) · BDM assessment</label><input name="estimatedValue" id="assignmentValue" type="number" min="0" value="${estimate||''}" placeholder="e.g. 7500000" oninput="updateAssignmentRouting()"></div>
 <div class="field"><label>Sales assignment category (automatic)</label><input id="assignmentRoute" value="${salesRouteForValue(estimate)}" readonly></div>
 <div class="field full"><label>Assigned sales owner</label><select name="salesOwner" id="assignmentOwner">${ownerOptions.map(u=>`<option value="${u.id}">${u.name} · ${u.role}</option>`).join('')}</select></div>
 <div class="field"><label>Assigned Tech Person</label><select name="techPerson">${users.filter(u=>u.role==='Tech Person').map(u=>`<option value="${u.id}" ${r.techPerson===u.id?'selected':''}>${u.name}</option>`).join('')}</select></div>
 <div class="field"><label>Assigned Concept Engineer</label><select name="conceptEngineer">${users.filter(u=>u.role==='Concept Engineer').map(u=>`<option value="${u.id}" ${r.conceptEngineer===u.id?'selected':''}>${u.name}</option>`).join('')}</select></div>
 <div class="field"><label>Assigned Costing Engineer</label><select name="costingEngineer">${users.filter(u=>u.role==='Costing Engineer').map(u=>`<option value="${u.id}" ${r.costingEngineer===u.id?'selected':''}>${u.name}</option>`).join('')}</select></div>
 <div class="field"><label>Manager site visit rule</label><input id="managerVisitFlag" value="${autoVisit?'YES · Automatic (> ₹100 lakh)':'Optional below threshold'}" readonly></div>
 <div class="field full"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="managerVisitManual" name="managerVisitManual" ${autoVisit?'checked':''} ${autoVisit?'disabled':''} style="width:auto"> Require an additional manager site visit (BDM override)</label></div>
 <div class="field"><label>Assigned manager for site visit</label><select name="manager" id="assignmentManager"><option value="">Select manager</option>${managerOptions.map(u=>`<option value="${u.id}">${u.name} · ${u.role}</option>`).join('')}</select></div>
 <div class="field full"><label>Assignment / capability remarks</label><textarea name="note" placeholder="Capability fit, project complexity, reason for manager visit"></textarea></div>
 <div class="field full"><div class="notice" id="assignmentRuleNote" style="margin:0">${assignmentRuleMessage(estimate)}</div></div>
 </form>`,`<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAssignment('${id}')">Confirm assignment</button>`);
 updateAssignmentRouting();
}
function assignmentRuleMessage(v){
 let n=Number(v)||0, route=salesRouteForValue(n), visit=managerVisitForValue(n);
 return `Routing rule: below ₹50 lakh → Site Sales; above ₹50 lakh → Senior Sales. Above ₹100 lakh → manager site visit is automatically required. ${n===5000000?'Exactly ₹50 lakh: select the appropriate sales category after confirming the business rule.':''}${visit?' A manager must be assigned and the in-person site visit recorded before the deal can proceed to Concept.':''}`;
}
function updateAssignmentRouting(){
 let form=$('assignForm');if(!form)return;
 let v=Number($('assignmentValue').value)||0,route=salesRouteForValue(v),visit=managerVisitForValue(v);
 $('assignmentRoute').value=route;
 $('managerVisitFlag').value=visit?'YES · Automatic (> ₹100 lakh)':'No · Optional below threshold';
 $('assignmentRuleNote').textContent=assignmentRuleMessage(v);
 let select=$('assignmentOwner'),current=select.value;
 let allowed=users.filter(u=>route==='Senior Sales'?u.role==='Senior Sales':route==='Site Sales'?u.role==='Site Sales':['Site Sales','Senior Sales'].includes(u.role));
 if(route==='Confirm at ₹50 lakh')allowed=users.filter(u=>['Site Sales','Senior Sales'].includes(u.role));
 select.innerHTML=allowed.map(u=>`<option value="${u.id}">${u.name} · ${u.role}</option>`).join('');
 if(allowed.some(u=>u.id===current))select.value=current;
 let mgr=$('assignmentManager');
 let manual=$('managerVisitManual');
 if(visit){manual.checked=true;manual.disabled=true;mgr.required=true;if(!mgr.value)mgr.value='u6';}
 else {manual.disabled=false;mgr.required=manual.checked;if(manual.checked&&!mgr.value)mgr.value='u6';}
 manual.onchange=()=>{mgr.required=manual.checked;if(manual.checked&&!mgr.value)mgr.value='u6';};
}
function assignDeal(){let id=$('assignLead')?.value;if(id)openAssignmentModal(id);}
function saveAssignment(id){
 let f=Object.fromEntries(new FormData($('assignForm')).entries()),r=records.find(x=>x.id===id);
 let estimate=Number(f.estimatedValue)||0,route=salesRouteForValue(estimate),salesUser=user(f.salesOwner);
 if(!estimate){alert('Enter the BDM estimated project value before assignment.');return}
 if(route==='Confirm at ₹50 lakh'&&!['Site Sales','Senior Sales'].includes(salesUser.role)){alert('Select a valid sales owner for the ₹50 lakh boundary.');return}
 if(route!=='Confirm at ₹50 lakh'&&salesUser.role!==route){alert('The selected sales owner does not match the estimated-value routing rule.');return}
 let visitRequired=managerVisitForValue(estimate)||f.managerVisitManual==='on';
 if(visitRequired&&!f.manager){alert('A manager must be assigned because the estimated project value is above ₹100 lakh.');return}
 let previousStage=r.status;
 r.estimatedValue=estimate;r.salesAssignmentCategory=route==='Confirm at ₹50 lakh'?salesUser.role:route;r.salesOwner=f.salesOwner;
 r.site=salesUser.role==='Site Sales'?f.salesOwner:'';
 r.seniorSales=salesUser.role==='Senior Sales'?f.salesOwner:'';
 r.techPerson=f.techPerson||r.techPerson||'';r.conceptEngineer=f.conceptEngineer||r.conceptEngineer||'';r.costingEngineer=f.costingEngineer||r.costingEngineer||'';
 r.managerVisitRequired=visitRequired;r.assignedManager=f.manager||'';r.managerVisitStatus=visitRequired?'Pending':'Not Required';
 r.assignmentRemarks=f.note||'';if(['Qualified','Site Sales Assigned'].includes(previousStage))r.status='Site Sales Assigned';r.assignmentReviewRequired=false;
 log(r,'BDM assignment & value assessment',`Estimated value ${money(estimate)}. Routed to ${salesUser.role}: ${salesUser.name}. Manager site visit: ${visitRequired?'Automatically required; assigned to '+user(f.manager).name:'Not automatically required'}. ${f.note||''}`);
 save();closeModal();openRecord(id);
}
function techStudy(id){let r=records.find(x=>x.id===id);if(r&&!supervisor()&&user(currentUser).role!=='Tech Person'){alert('Only the assigned Tech Person or Site Sales owner can complete this study.');return}if(r&&!supervisor()&&user(currentUser).role==='Tech Person'&&r.techPerson!==currentUser){alert('This technical study is assigned to another Tech Person.');return}openModal('Technical study questionnaire',`<form id="techForm" class="formgrid">${field('Application / process','application','What should the robot do?')}${field('Target cycle time','cycle','e.g. 45 seconds')}${field('Capacity / shifts','capacity','e.g. 2 shifts')}${field('Budget indication (₹)','budget','Optional','number')}${field('Technical constraints','constraints','Safety, space, integration…')}<div class="field full"><label>Site visit / customer meeting notes</label><textarea name="meeting" placeholder="Joint visit by manager and tech person"></textarea></div></form>`,`<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTech('${id}')">Submit study for verification</button>`);}
function saveTech(id){let rec=records.find(x=>x.id===id);if(!supervisor()&&(user(currentUser).role!=='Tech Person'||rec?.techPerson!==currentUser)){alert('Only the assigned Tech Person can submit this technical study.');return}let f=Object.fromEntries(new FormData($('techForm')).entries()),r=records.find(x=>x.id===id);if(!f.application||!f.cycle){alert('Application and cycle time are required.');return}r.tech={...f,verified:false};r.status='Technical Study';log(r,'Technical study submitted','Submitted by '+user(currentUser).name+'; manager verification pending.');save();closeModal();openRecord(id);}
function verifyTech(id){let r=records.find(x=>x.id===id);if(!supervisor()&&(user(currentUser).role!=='Technical Manager'||r?.assignedManager!==currentUser)){alert('Only the assigned Technical Manager can verify this study.');return}if(!r?.tech){alert('Technical study not completed.');return}if(r.tech.verified){alert('This technical study has already been verified.');return}r.tech.verified=true;r.status='Technical Study';log(r,'Technical study verified','Verified by '+user(currentUser).name+'. Customer meeting completed / reviewed.');save();let next=r.managerVisitRequired&&r.managerVisitStatus!=='Completed'?'Manager in-person site visit':'Upload concept';let detail=r.managerVisitRequired&&r.managerVisitStatus!=='Completed'?'The study is verified. The required manager site visit must be recorded before the Concept Engineer can upload the concept.':'The study is verified. The Verify Technical Study action is now closed; the assigned Concept Engineer can upload the concept.';openModal('Technical study verified',`<div class="successbox"><b>Verification completed</b><p style="margin:8px 0 0">${detail}</p><p style="margin:8px 0 0"><b>Next step:</b> ${next}</p></div>`,`<button class="btn primary" onclick="closeModal();openRecord('${id}')">Continue</button>`);}
function recordManagerVisit(id){
 let r=records.find(x=>x.id===id);
 openModal('Manager in-person site visit',`<form id="managerVisitForm" class="formgrid">
 ${selectField('Manager attending','manager',users.filter(u=>['Technical Manager','BDM Head'].includes(u.role)).map(u=>u.id+' · '+u.name),r.assignedManager?`${r.assignedManager} · ${user(r.assignedManager).name}`:'')}
 ${field('Actual site visit date','visitDate','','date','2026-11-06')}
 <div class="field full"><label>Site visit observations / decisions</label><textarea name="observations" placeholder="Record manager observations, customer discussion, scope and next actions"></textarea></div>
 <div class="field full"><label>Visit outcome</label><select name="outcome"><option>Completed - proceed</option><option>Additional technical study required</option><option>Scope clarification required</option></select></div>
 </form>`,`<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveManagerVisit('${id}')">Save site visit</button>`);
}
function saveManagerVisit(id){
 let existing=records.find(x=>x.id===id);if(!supervisor()&&(user(currentUser).role!=='Technical Manager'||existing?.assignedManager!==currentUser)){alert('Only the assigned manager can record this site visit.');return}
 let f=Object.fromEntries(new FormData($('managerVisitForm')).entries()),r=records.find(x=>x.id===id);
 if(!f.manager||!f.visitDate||!f.observations.trim()){alert('Manager, visit date and site observations are required.');return}
 r.assignedManager=f.manager.split(' · ')[0];r.managerVisitStatus='Completed';
 r.managerVisitDate=f.visitDate;r.managerVisitOutcome=f.outcome;r.managerVisitNotes=f.observations;
 log(r,'Manager in-person site visit completed',`${user(r.assignedManager).name} · ${f.visitDate} · ${f.outcome}. ${f.observations}`);
 save();closeModal();openRecord(id);
}
function uploadConcept(id){let r=records.find(x=>x.id===id);if(!supervisor()&&(user(currentUser).role!=='Concept Engineer'||r?.conceptEngineer!==currentUser)){alert('Only the assigned Concept Engineer can upload this concept.');return}openModal('Upload concept',`<form id="conceptForm" class="formgrid">${field('Concept file name / reference','file','e.g. Concept_v1.pdf')}${selectField('Concept engineer','engineer',users.filter(u=>u.role==='Concept Engineer').map(u=>u.id+' · '+u.name))}<div class="field full"><label>Design notes</label><textarea name="notes" placeholder="Concept summary and assumptions"></textarea></div><div class="field full muted" style="font-size:10px">Demo mode: enter a file name/reference. No file is uploaded to WorkDrive.</div></form>`,`<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveConcept('${id}')">Save concept</button>`);}
function saveConcept(id){let rec=records.find(x=>x.id===id);if(!supervisor()&&(user(currentUser).role!=='Concept Engineer'||rec?.conceptEngineer!==currentUser)){alert('Only the assigned Concept Engineer can submit this concept.');return}let f=Object.fromEntries(new FormData($('conceptForm')).entries()),r=records.find(x=>x.id===id);if(!f.file){alert('Enter a concept file name or reference.');return}r.concept=f.file;r.conceptEngineer=f.engineer.split(' · ')[0];r.status='Concept Uploaded';log(r,'Concept uploaded',`${r.concept} · ${r.conceptEngineer}. ${f.notes}`);save();closeModal();openRecord(id);}
function prepareQuote(id){let r=records.find(x=>x.id===id);if(!supervisor()&&(user(currentUser).role!=='Costing Engineer'||r?.costingEngineer!==currentUser)){alert('Only the assigned Costing Engineer can prepare this quote.');return}openModal('Costing & quote preparation',`<form id="quoteForm" class="formgrid">${field('Quote value (₹)','quote','Amount in INR','number')}${field('Quote reference','quoteNo','IR-Q-260XX')}${selectField('Costing engineer','engineer',users.filter(u=>u.role==='Costing Engineer').map(u=>u.id+' · '+u.name),r?.costingEngineer?`${r.costingEngineer} · ${user(r.costingEngineer).name}`:'')}${field('Target completion date','due','','date','2026-11-08')}<div class="field full"><label>Costing notes / assumptions</label><textarea name="notes" placeholder="Material, engineering and project assumptions"></textarea></div></form><div class="notice" style="margin-top:12px">Architecture target: costing and quote within 2 days after concept upload.</div>`,`<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveQuote('${id}')">Save quote</button>`);}
function saveQuote(id){let rec=records.find(x=>x.id===id);if(!supervisor()&&(user(currentUser).role!=='Costing Engineer'||rec?.costingEngineer!==currentUser)){alert('Only the assigned Costing Engineer can submit this costing.');return}let f=Object.fromEntries(new FormData($('quoteForm')).entries()),r=records.find(x=>x.id===id);if(!f.quote||!f.quoteNo){alert('Quote value and reference are required.');return}r.quote=+f.quote;r.quoteNo=f.quoteNo;r.quoteDue=f.due;r.costingEngineer=f.engineer.split(' · ')[0];r.quoteNotes=f.notes;r.status='Costing & Quote';r.quoteRoute=r.quote<5000000?'Site Sales':r.quote>5000000?'Senior Sales':'Confirm ₹50 lakh boundary';
let finalRoute=salesRouteForValue(r.quote);
if(finalRoute!==r.salesAssignmentCategory){r.assignmentReviewRequired=true;log(r,'Sales assignment review required',`Final quote ${money(r.quote)} changes the sales routing category to ${finalRoute}. BDM must review and reassign/confirm ownership.`);}
if(managerVisitForValue(r.quote)&&!r.managerVisitRequired){r.managerVisitRequired=true;r.managerVisitStatus='Pending';r.assignedManager='';r.assignmentReviewRequired=true;log(r,'Manager site visit triggered by revised value',`Final quote ${money(r.quote)} is above ₹100 lakh. Manager site visit is now mandatory; BDM must assign the manager.`);}log(r,'Costing & quote prepared',`Quote ${r.quoteNo} for ${money(r.quote)}. Routing: ${r.quoteRoute}. Target: ${r.quoteDue}.`);save();closeModal();openRecord(id);}
function sendQuote(id){let r=records.find(x=>x.id===id);if(!supervisor()&&!((user(currentUser).role==='Site Sales'&&r?.salesOwner===currentUser)||(user(currentUser).role==='Senior Sales'&&(r?.salesOwner===currentUser||r?.seniorSales===currentUser)))){alert('Only the assigned Sales Owner can send the quotation.');return}r.status='Follow-up';r.quoteSent=true;log(r,'Quote sent','Quote '+r.quoteNo+' sent. Follow-up reminders now active.');activities.unshift({lead:id,type:'Follow-up',owner:user(currentUser).name,date:'06 Nov 2026',note:'Quote '+r.quoteNo+' sent to customer.'});save();closeModal();openRecord(id);}
function reviseQuote(id){let r=records.find(x=>x.id===id);openModal('Quote revision · CEO approval',`<form id="revForm" class="formgrid">${field('Revised quote value (₹)','amount','New amount','number',r.quote||r.value)}${field('Revision reference','ref',(r.quoteNo||'IR-Q')+'-R1')}<div class="field full"><label>Changed customer requirement</label><textarea name="reason" placeholder="Describe changed requirement"></textarea></div></form><div class="notice">Any cost revision requires CEO approval as per the solution architecture. This demo records the approval gate before applying the revision.</div>`,`<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="requestRevision('${id}')">Submit for CEO approval</button>`);}
function requestRevision(id){let f=Object.fromEntries(new FormData($('revForm')).entries()),r=records.find(x=>x.id===id);if(!f.reason){alert('Revision reason is required.');return}if(user(currentUser).role!=='CEO'){closeModal();openModal('CEO approval required',`<p style="font-size:13px">Cost revision ${f.ref} for ${money(f.amount)} has been submitted for CEO approval.</p><div class="notice">Switch the acting user to CEO to approve this cost revision.</div><div class="actionbuttons"><button class="btn primary" onclick="switchUser('u13');closeModal();openRecord('${id}')">Switch to CEO</button></div>`,`<button class="btn secondary" onclick="closeModal()">Close</button>`);r.pendingRevision=f;log(r,'Cost revision submitted for CEO approval',f.reason);save();return}applyRevision(id,f);}
function applyRevision(id,f){let r=records.find(x=>x.id===id);r.quote=+f.amount;r.quoteNo=f.ref;r.pendingRevision=null;log(r,'Cost revision approved by CEO',f.reason);save();closeModal();openRecord(id);}
function approvePendingRevision(id){let r=records.find(x=>x.id===id);if(user(currentUser).role!=='CEO'||!r.pendingRevision)return;let f=r.pendingRevision;applyRevision(id,f);}
function markWon(id){let r=records.find(x=>x.id===id);if(!supervisor()&&!((user(currentUser).role==='Site Sales'&&r?.salesOwner===currentUser)||(user(currentUser).role==='Senior Sales'&&(r?.salesOwner===currentUser||r?.seniorSales===currentUser)))){alert('Only the assigned Sales Owner can mark this deal Won.');return}r.status='Won';log(r,'Deal Won','Customer accepted the quote. Ready for BDM sales order creation.');save();closeModal();openRecord(id);}
function markLost(id){let rec=records.find(x=>x.id===id);if(!supervisor()&&!((user(currentUser).role==='Site Sales'&&rec?.salesOwner===currentUser)||(user(currentUser).role==='Senior Sales'&&(rec?.salesOwner===currentUser||rec?.seniorSales===currentUser)))){alert('Only the assigned Sales Owner can close this deal as Lost.');return}closeModal();openModal('Close deal as Lost',`<form id="lostDeal" class="formgrid">${selectField('Loss reason','reason',['Price / budget','Competitor selected','Project cancelled','Timeline not suitable','Technical mismatch','No response','Other'])}<div class="field full"><label>Closure notes</label><textarea name="notes"></textarea></div></form>`,`<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="saveLost('${id}')">Close as Lost</button>`);}
function saveLost(id){let f=Object.fromEntries(new FormData($('lostDeal')).entries()),r=records.find(x=>x.id===id);if(f.reason==='Other'&&!f.notes.trim()){alert('Please explain the reason when Other is selected.');return}r.status='Lost';r.lostReason=f.reason+(f.notes?' · '+f.notes:'');log(r,'Deal Lost',r.lostReason);save();closeModal();render();}
function createSalesOrder(id){let r=records.find(x=>x.id===id);if(!['BDM Head','CEO'].includes(user(currentUser).role)){alert('Only the BDM Head creates the sales order in this demo.');return}let no='IR-SO-'+id.replace('IRL-','');r.salesOrder=no;salesOrders.unshift({no,lead:id,customer:r.name,amount:r.quote||r.value,date:'06 Nov 2026',books:'Synced (demo)',creator:'Project opened (demo)'});log(r,'Sales order created by BDM',no+' simulated sync to Zoho Books and project opening in Zoho Creator.');save();closeModal();render();alert('Sales Order '+no+' created. Zoho Books sync and Creator project opening are marked as demo events.');}
init();
</script></body></html>
